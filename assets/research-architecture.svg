<svg width="100%" height="auto" viewBox="0 0 900 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Terracotta Arrow Markers -->
    <marker id="arrowTerracotta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#E07A5F" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', Consolas, Menlo, monospace; }
  </style>

  <!-- Canvas Base: Dark Slate #191C1E -->
  <rect width="900" height="390" rx="10" fill="#191C1E" stroke="#363C42" stroke-width="1"/>

  <!-- ==================== PILLAR 1: SYSTEMS ==================== -->
  <g transform="translate(35, 26)">
    <!-- Card Container: Elevated Slate #23272B -->
    <rect width="260" height="152" rx="8" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    
    <!-- Top Pill Badge: #2D3339 with Terracotta #E07A5F text -->
    <rect x="14" y="14" width="138" height="20" rx="4" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="83" y="28" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">SYSTEMS &amp; COMPUTE</text>
    
    <!-- Title: Warm Crisp White #F7F6F2 -->
    <text x="14" y="56" fill="#F7F6F2" font-size="14.5" font-weight="600" class="font-sans">Tensor Compute &amp; Autograd</text>
    <line x1="14" y1="68" x2="246" y2="68" stroke="#363C42" stroke-width="0.8"/>

    <!-- Bullets: Muted Warm Stone #B5B0A6 -->
    <circle cx="20" cy="86" r="2.5" fill="#E07A5F"/>
    <text x="29" y="90" fill="#B5B0A6" font-size="11" class="font-sans">Custom C++ and CUDA Kernels</text>

    <circle cx="20" cy="108" r="2.5" fill="#E07A5F"/>
    <text x="29" y="112" fill="#B5B0A6" font-size="11" class="font-sans">Reverse-Mode Autodiff (MyTorch)</text>

    <circle cx="20" cy="130" r="2.5" fill="#E07A5F"/>
    <text x="29" y="134" fill="#B5B0A6" font-size="11" class="font-sans">Strided Tensor Memory Layouts</text>
  </g>

  <!-- ==================== PILLAR 2: GENERATIVE ==================== -->
  <g transform="translate(320, 26)">
    <!-- Card Container -->
    <rect width="260" height="152" rx="8" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    
    <!-- Top Pill Badge -->
    <rect x="14" y="14" width="138" height="20" rx="4" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="83" y="28" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">GENERATIVE MODELS</text>

    <!-- Title -->
    <text x="14" y="56" fill="#F7F6F2" font-size="14.5" font-weight="600" class="font-sans">Diffusion &amp; Frame Generation</text>
    <line x1="14" y1="68" x2="246" y2="68" stroke="#363C42" stroke-width="0.8"/>

    <!-- Bullets -->
    <circle cx="20" cy="86" r="2.5" fill="#E07A5F"/>
    <text x="29" y="90" fill="#B5B0A6" font-size="11" class="font-sans">Diffusion Models (DDPM / DDIM)</text>

    <circle cx="20" cy="108" r="2.5" fill="#E07A5F"/>
    <text x="29" y="112" fill="#B5B0A6" font-size="11" class="font-sans">Video Frame Interpolation</text>

    <circle cx="20" cy="130" r="2.5" fill="#E07A5F"/>
    <text x="29" y="134" fill="#B5B0A6" font-size="11" class="font-sans">Flow Matching</text>
  </g>

  <!-- ==================== PILLAR 3: RL & PLANNING ==================== -->
  <g transform="translate(605, 26)">
    <!-- Card Container -->
    <rect width="260" height="152" rx="8" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    
    <!-- Top Pill Badge -->
    <rect x="14" y="14" width="138" height="20" rx="4" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="83" y="28" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">PLANNING &amp; RL</text>

    <!-- Title -->
    <text x="14" y="56" fill="#F7F6F2" font-size="14.5" font-weight="600" class="font-sans">Reinforcement Learning</text>
    <line x1="14" y1="68" x2="246" y2="68" stroke="#363C42" stroke-width="0.8"/>

    <!-- Bullets -->
    <circle cx="20" cy="86" r="2.5" fill="#E07A5F"/>
    <text x="29" y="90" fill="#B5B0A6" font-size="11" class="font-sans">Sparse Rewards &amp; HER</text>

    <circle cx="20" cy="108" r="2.5" fill="#E07A5F"/>
    <text x="29" y="112" fill="#B5B0A6" font-size="11" class="font-sans">BlocksWorld Planning</text>

    <circle cx="20" cy="130" r="2.5" fill="#E07A5F"/>
    <text x="29" y="134" fill="#B5B0A6" font-size="11" class="font-sans">Policy &amp; Value Networks</text>
  </g>

  <!-- ==================== CONNECTING CONVERGENCE ARROWS ==================== -->
  <!-- Left to Center -->
  <path d="M 165 178 C 165 220, 275 220, 275 254" stroke="#9E998F" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- Mid straight to Center -->
  <path d="M 450 178 L 450 245" stroke="#9E998F" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- Right to Center -->
  <path d="M 735 178 C 735 220, 625 220, 625 254" stroke="#9E998F" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- ==================== CONVERGENCE HUB ==================== -->
  <g transform="translate(90, 258)">
    <!-- Main Card Body: Solid #23272B with #363C42 border -->
    <rect width="720" height="106" rx="8" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <!-- Terracotta Accent Top Border Accent -->
    <rect x="0" y="0" width="720" height="2" rx="1" fill="#E07A5F"/>

    <!-- Top Badge -->
    <rect x="280" y="-10" width="160" height="20" rx="4" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="360" y="4" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">RESEARCH FOCUS</text>

    <!-- Main Heading -->
    <text x="360" y="38" fill="#F7F6F2" font-size="16" font-weight="700" text-anchor="middle" class="font-sans">
      AI Research: How Models Learn Structure
    </text>

    <!-- Subtitle / Rationale -->
    <text x="360" y="59" fill="#B5B0A6" font-size="11.5" text-anchor="middle" class="font-sans">
      Building from scratch to understand representation, generation, and planning
    </text>

    <!-- Pills / Tags -->
    <g transform="translate(0, 81)">
      <!-- Tag 1 -->
      <rect x="70" y="0" width="160" height="19" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
      <text x="150" y="13" fill="#9E998F" font-size="9.5" text-anchor="middle" class="font-mono">TENSOR COMPUTE</text>

      <!-- Tag 2 -->
      <rect x="270" y="0" width="180" height="19" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
      <text x="360" y="13" fill="#E07A5F" font-size="9.5" text-anchor="middle" class="font-mono">DIFFUSION MODELS</text>

      <!-- Tag 3 -->
      <rect x="490" y="0" width="160" height="19" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
      <text x="570" y="13" fill="#9E998F" font-size="9.5" text-anchor="middle" class="font-mono">PLANNING &amp; RL</text>
    </g>
  </g>
</svg>
